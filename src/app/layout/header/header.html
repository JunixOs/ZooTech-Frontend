<header class="header-container">
  <div class="header-left">
    <button
      class="menu-button"
      (click)="hamburgerClick.emit()"
    >
      <i class="fa-solid fa-bars menu-icon"></i>
    </button>
    <img src="assets/zootechBlanco.svg" alt="logo" class="logo" />
  </div>

  <div class="header-actions">
    <div class="header-title-container">
      <p routerLink="/dashboard" class="header-title">{{ 'layout.header.title' | translate }}</p>
      <a routerLink="/dashboard" class="home-link">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>

    <button class="action-button">
      <i class="fa-regular fa-bell action-icon"></i>
      <span class="badge">
        1
      </span>
    </button>
    <button class="user-avatar-button">
      <i class="fa-regular fa-user user-icon"></i>
    </button>
  </div>
</header>
