<header class="flex items-center justify-between h-14 px-4 bg-primary text-white shadow-md shrink-0">
  <button
    class="p-2 rounded hover:bg-primary-hover transition-colors border-0 cursor-pointer bg-transparent text-white"
    type="button"
    aria-label="Abrir menú"
    (click)="hamburgerClick.emit()"
  >
    <i class="fa-solid fa-bars text-xl"></i>
  </button>

  <div class="flex items-center gap-3">
    <div class="language-switch" aria-label="Selector de idioma">
      @for (language of languages; track language.code) {
        <button
          class="language-switch__button"
          type="button"
          [class.language-switch__button--active]="currentLanguage() === language.code"
          [attr.aria-pressed]="currentLanguage() === language.code"
          [attr.title]="language.label"
          (click)="changeLanguage(language.code)"
        >
          {{ language.shortLabel }}
        </button>
      }
    </div>

    <button class="relative p-2.5 rounded hover:bg-primary-hover transition-colors border-0 cursor-pointer bg-transparent text-white" type="button" aria-label="Notificaciones">
      <i class="fa-solid fa-bell text-lg"></i>
      <span class="absolute top-1.5 right-1.5 w-4 h-4 bg-accent text-white text-xs rounded-full flex items-center justify-center font-bold leading-none">
        1
      </span>
    </button>
    <button class="w-9 h-9 rounded-full bg-primary-dark hover:bg-primary-hover transition-colors border-0 cursor-pointer flex items-center justify-center" type="button" aria-label="Usuario">
      <i class="fa-solid fa-user text-sm text-white"></i>
    </button>
  </div>
</header>
