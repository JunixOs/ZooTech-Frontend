<header class="flex items-center justify-between h-16 px-6 bg-primary text-white shadow-lg z-10 shrink-0">
  <button
    class="p-2.5 rounded-lg hover:bg-white/10 transition-colors border-0 cursor-pointer bg-transparent text-white"
    (click)="hamburgerClick.emit()"
    aria-label="Abrir menu"
  >
    <i class="fa-solid fa-bars text-xl"></i>
  </button>

  <div class="flex items-center gap-4">
    <button
      class="relative p-2.5 rounded-lg hover:bg-white/10 transition-colors border-0 cursor-pointer bg-transparent text-white"
      aria-label="Notificaciones"
    >
      <i class="fa-solid fa-bell text-xl"></i>
      <span class="absolute top-1 right-1 w-5 h-5 bg-accent text-white text-[11px] rounded-full flex items-center justify-center font-extrabold shadow-sm">
        1
      </span>
    </button>
    <button
      class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 transition-all border-0 cursor-pointer flex items-center justify-center shadow-inner"
      aria-label="Cerrar sesion"
      title="Cerrar sesion"
      (click)="logout()"
    >
      <i class="fa-solid fa-right-from-bracket text-base text-white"></i>
    </button>
  </div>
</header>
