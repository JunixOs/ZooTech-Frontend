<header class="flex items-center justify-between h-14 px-4 bg-primary text-white shadow-md shrink-0">
  <button
    class="p-2 rounded hover:bg-primary-hover transition-colors border-0 cursor-pointer bg-transparent text-white"
    (click)="hamburgerClick.emit()"
  >
    <i class="fa-solid fa-bars text-xl"></i>
  </button>

  <div class="flex items-center gap-1">
    <button class="relative p-2.5 rounded hover:bg-primary-hover transition-colors border-0 cursor-pointer bg-transparent text-white">
      <i class="fa-solid fa-bell text-lg"></i>
      <span class="absolute top-1.5 right-1.5 w-4 h-4 bg-accent text-white text-xs rounded-full flex items-center justify-center font-bold leading-none">
        1
      </span>
    </button>
    <button class="w-9 h-9 rounded-full bg-primary-dark hover:bg-primary-hover transition-colors border-0 cursor-pointer flex items-center justify-center">
      <i class="fa-solid fa-user text-sm text-white"></i>
    </button>
  </div>
</header>
