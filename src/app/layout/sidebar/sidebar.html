<aside
  class="flex flex-col h-full bg-primary transition-all duration-300 overflow-hidden shadow-xl"
  [ngClass]="collapsed() ? 'w-20' : 'w-72'"
>
  <div class="flex items-center justify-end px-4 pt-4 pb-2 lg:hidden border-b border-white/10 shrink-0">
    <button
      class="text-white/60 hover:text-white transition-colors bg-transparent border-0 cursor-pointer p-1.5 rounded"
      (click)="close.emit()"
      aria-label="Cerrar navegacion"
    >
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
  </div>

  @if (!collapsed()) {
    <div class="px-6 pt-6 pb-2 shrink-0">
      <span class="text-white/30 text-[11px] font-bold uppercase tracking-[0.2em]">Navegacion</span>
    </div>
  } @else {
    <div class="pt-6 pb-2 shrink-0"></div>
  }

  <nav class="flex flex-col px-3 gap-1 pt-2 pb-6 overflow-y-auto flex-1 custom-scrollbar">
    @for (section of navSections(); track section.label) {
      <zt-sidebar-nav-item [section]="section" [collapsed]="collapsed()" />
    }
  </nav>
</aside>
