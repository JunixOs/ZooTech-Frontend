<aside
  class="sidebar-container"
  [class.sidebar-collapsed]="collapsed()"
>
  <!-- Botón cerrar: solo mobile -->
  <div class="close-btn-container">
    <button
      class="close-button"
      (click)="close.emit()"
    >
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
  </div>

  <!-- Label "Navegación" -->
  @if (!collapsed()) {
    <div class="section-label-container">
      <span class="section-label">Navegación</span>
    </div>
  } @else {
    <div class="section-divider"></div>
  }

  <nav class="nav-list">
    @for (section of navSections(); track section.label) {
      <zt-sidebar-nav-item [section]="section" [collapsed]="collapsed()"/>
    }
  </nav>
</aside>
