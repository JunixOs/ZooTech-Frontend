<aside class="sidebar-container" [class.sidebar-collapsed]="collapsed()">
  <!-- Cabecera del Sidebar: Logo y Controles -->
  <div class="sidebar-header">
    <div class="sidebar-header-left">
      <!-- Botón collapse (desktop) -->
      <button
        class="collapse-button-desktop"
        (click)="toggleCollapse.emit()"
        [title]="'sidebar.collapseMenu' | translate"
      >
        <i class="fa-solid fa-bars"></i>
      </button>
      @if (!collapsed()) {
        <span class="section-label">{{ 'sidebar.navigation' | translate }}</span>
      }
    </div>

    <!-- Botón cerrar (mobile) -->
    <button
      class="close-button-mobile"
      (click)="close.emit()"
      [title]="'sidebar.closeMenu' | translate"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- Lista de Navegación -->
  <nav class="nav-list">
    @for (section of navSections(); track section.label) {
      <zt-sidebar-nav-item [section]="section" [collapsed]="collapsed()" />
    }
  </nav>

  <!-- Pie del Sidebar: Perfil y Notificaciones -->
  <div class="sidebar-footer">
    <div class="user-profile">
      <button class="user-avatar-button" [title]="'sidebar.userProfile' | translate">
        <i class="fa-regular fa-user user-avatar-icon"></i>
        @if (collapsed() && hasNotifications()) {
          <span class="badge-dot"></span>
        }
      </button>
      @if (!collapsed()) {
        <div class="user-details">
          <span class="user-name">{{ 'sidebar.administrator' | translate }}</span>
          <span class="user-role">{{ 'sidebar.saasAdmin' | translate }}</span>
        </div>
      }
    </div>

    <div class="footer-actions" [class.footer-actions-collapsed]="collapsed()">
      @if (!collapsed()) {
        <button class="notification-btn" [title]="'sidebar.notifications' | translate">
          <i class="fa-regular fa-bell notification-icon"></i>
          @if (hasNotifications()) {
            <span class="badge">1</span>
          }
        </button>
      }
      <button class="logout-btn" [title]="'common.logout' | translate" (click)="logout.emit()">
        <i class="fa-solid fa-right-from-bracket logout-icon"></i>
      </button>
    </div>
  </div>
</aside>
