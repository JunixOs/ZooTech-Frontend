<div class="flex flex-col h-screen bg-bg-app">
  <zt-header (hamburgerClick)="toggleSidebar()" />

  <div class="flex flex-1 overflow-hidden">
    @if (sidebarMobileOpen()) {
      <div
        class="fixed inset-0 bg-black/40 z-30 lg:hidden"
        (click)="sidebarMobileOpen.set(false)"
      ></div>
    }

    <div
      class="fixed lg:static inset-y-0 left-0 z-40 shrink-0 transition-all duration-300 ease-in-out lg:translate-x-0"
      [ngClass]="sidebarMobileOpen() ? 'translate-x-0' : '-translate-x-full'"
    >
      <zt-sidebar
        [collapsed]="sidebarCollapsed()"
        (close)="sidebarMobileOpen.set(false)"
      />
    </div>

    <main class="flex-1 overflow-auto p-4 lg:p-6 min-w-0">
      <router-outlet />
    </main>
  </div>

  <zt-footer />
</div>
