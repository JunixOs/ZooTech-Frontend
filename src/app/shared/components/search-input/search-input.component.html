<div class="relative">
  <!-- Icono de lupa -->
  <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
    <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
  </div>

  <!-- Input -->
  <input
    type="text"
    [ngModel]="term()"
    (ngModelChange)="onInput($event)"
    [placeholder]="placeholder()"
    (keydown)="onKeydown($event)"
    class="w-full pl-10 pr-10 py-2.5 bg-white border border-pink-200 rounded-lg 
           text-sm text-slate-700 placeholder-slate-400
           focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-100 
           transition-colors duration-150"
  />

  <!-- Botón limpiar (visible solo cuando hay texto) -->
  @if (term()) {
    <button
      type="button"
      (click)="onClear()"
      class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 
             hover:text-slate-600 transition-colors cursor-pointer bg-transparent border-0"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
  }

  <!-- Botón buscar -->
  @if (term()) {
    <button
      type="button"
      (click)="onSearch()"
      class="absolute inset-y-0 right-8 flex items-center pr-3 text-pink-500 
             hover:text-pink-700 transition-colors cursor-pointer bg-transparent border-0"
    >
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  }
</div>
