<div class="report-layout-container">
  <!-- Encabezado con título y acciones -->
  <div class="report-layout-header">
    <h2 class="report-layout-title">{{ title() || ('shared.reports.title' | translate) }}</h2>

    <!-- Slot para acciones del módulo (ej: botón "Nuevo") -->
    <div class="report-layout-actions">
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>

  <!-- Filtros: fecha + búsqueda -->
  <div class="report-layout-filters">
    <zt-date-range-filter
      [label]="'shared.filters.dateRange' | translate"
      (rangeChange)="rangeChange.emit($event)"
    />

    <div class="report-search-wrapper">
      <zt-search-input
        [placeholder]="'shared.search.reportPlaceholder' | translate"
        (search)="search.emit($event)"
      />
    </div>
  </div>

  <!-- Contenido principal: grid de reportes -->
  <zt-report-grid [reports]="reports()" [loading]="loading()" />
</div>
