<div class="flex flex-wrap items-center gap-6">
  <!-- Fecha inicio -->
  <div class="flex flex-col gap-2">
    <span class="text-xs font-bold text-slate-700 ml-1">
      {{ 'shared.filters.startDate' | translate }}
    </span>
    <div class="relative group">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <i class="fa-regular fa-calendar text-slate-400 group-focus-within:text-rose-800 transition-colors"></i>
      </div>
      <input
        type="date"
        [ngModel]="startDate()"
        (ngModelChange)="onStartChange($event)"
        class="w-full pl-10 pr-4 py-2 bg-white border border-slate-300 rounded text-sm font-semibold text-slate-700 focus:outline-none focus:border-rose-800 transition-colors shadow-sm"
      />
    </div>
  </div>
  <!-- Fecha fin -->
  <div class="flex flex-col gap-2">
    <span class="text-xs font-bold text-slate-700 ml-1">
      {{ 'shared.filters.endDate' | translate }}
    </span>
    <div class="relative group">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <i class="fa-regular fa-calendar text-slate-400 group-focus-within:text-rose-800 transition-colors"></i>
      </div>
      <input
        type="date"
        [ngModel]="endDate()"
        (ngModelChange)="onEndChange($event)"
        class="w-full pl-10 pr-4 py-2 bg-white border border-slate-300 rounded text-sm font-semibold text-slate-700 focus:outline-none focus:border-rose-800 transition-colors shadow-sm"
      />
    </div>
  </div>

  <!-- Botón limpiar -->
  @if (startDate() || endDate()) {
    <button
      type="button"
      (click)="onClear()"
      class="mt-6 p-2 text-slate-400 hover:text-rose-800 transition-colors cursor-pointer bg-transparent border-0"
      [title]="'shared.actions.clear' | translate"
    >
      <i class="fa-solid fa-rotate-right text-base"></i>
    </button>
  }
</div>
