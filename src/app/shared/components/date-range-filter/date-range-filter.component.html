<div class="flex items-center gap-3">
  <!-- Fecha inicio -->
  <div class="flex flex-col gap-1">
    <span class="text-xs text-slate-400 pl-1">{{ 'shared.filters.startDate' | translate }}</span>
    <div class="flex items-center gap-2 bg-white border border-gray-400 rounded-lg px-3 h-10 shadow-sm">
      <i class="fa-solid fa-calendar text-slate-400 text-sm"></i>
      <input
        type="date"
        [ngModel]="startDate()"
        (ngModelChange)="onStartChange($event)"
        class="text-sm font-medium text-slate-700 focus:outline-none border-0 bg-transparent h-full"
      />
    </div>
  </div>
  <!-- Fecha fin -->
  <div class="flex flex-col gap-1">
    <span class="text-xs text-slate-400 pl-1">{{ 'shared.filters.endDate' | translate }}</span>
    <div class="flex items-center gap-2 bg-white border border-gray-400 rounded-lg px-3 h-10 shadow-sm">
      <i class="fa-solid fa-calendar text-slate-400 text-sm"></i>
      <input
        type="date"
        [ngModel]="endDate()"
        (ngModelChange)="onEndChange($event)"
        class="text-sm font-medium text-slate-700 focus:outline-none border-0 bg-transparent h-full"
      />
    </div>
  </div>

  @if (startDate() || endDate()) {
    <button
      type="button"
      (click)="onClear()"
      class="p-2 text-slate-400 hover:text-rose-600 rounded-lg transition-all duration-200 cursor-pointer bg-transparent border-0 mt-5"
    >
      <i class="fa-solid fa-rotate-right text-sm"></i>
    </button>
  }
</div>
