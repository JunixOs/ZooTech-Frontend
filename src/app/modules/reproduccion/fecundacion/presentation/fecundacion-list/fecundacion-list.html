<section class="fecundacion-status-page">
  <zt-page-header
    title="reproduccion.fecundacion.status.title"
    breadcrumbParent="sidebar.reproduccion"
    breadcrumbParentRoute="/reproduccion/fecundacion"
    breadcrumbCurrent="sidebar.estadoF"
  />

  <div class="status-toolbar">
    <button type="button" class="reload-button" (click)="load()" [disabled]="loading()"
      [title]="'shared.actions.search' | translate">
      <i class="fa-solid fa-rotate-right" [class.fa-spin]="loading()"></i>
    </button>
    <a class="primary-action" routerLink="/reproduccion/fecundacion/registrar">
      <i class="fa-solid fa-circle-plus"></i>
      {{ 'sidebar.registroF' | translate }}
    </a>
  </div>

  @if (error()) {
    <div class="status-error" role="alert">{{ error()! | translate }}</div>
  }

  <div class="status-card">
    <zt-data-table
      [columns]="columns"
      [data]="tableData()"
      [loading]="loading()"
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      [totalItems]="filtered().length"
      (search)="onSearch($event)"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    />
  </div>
</section>
