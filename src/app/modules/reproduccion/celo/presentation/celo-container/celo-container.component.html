<div class="celo-container">
  <!-- Header de la Página -->
  <div class="celo-header">
    <h2 class="page-title">
      {{ 'reproduccion.celo.title' | translate }}
    </h2>
    <div class="header-actions">
      <nav class="breadcrumb">
        <span class="breadcrumb-link">{{ 'sidebar.reproduccion' | translate }}</span>
        <i class="fa-solid fa-chevron-right breadcrumb-separator"></i>
        <span class="breadcrumb-active">{{ 'sidebar.celo' | translate }}</span>
      </nav>
      <a
        routerLink="/reproduccion/celo/vacas"
        class="header-btn"
      >
        <i class="fa-solid fa-list-ul"></i>
        <span>{{ 'reproduccion.celo.actions.viewVacas' | translate }}</span>
      </a>
    </div>
  </div>

  <!-- Contenedor Principal (Card) -->
  <div class="content-card">
    <!-- Filtros Superiores -->
    <div class="filter-bar">
      <div class="filter-inputs">
        <zt-date-range-filter
          [label]="'shared.filters.dateRange' | translate"
          (rangeChange)="onDateRangeChange($event)"
        />
        <button
          type="button"
          (click)="onApplyFilters()"
          class="filter-submit-btn"
          [title]="'shared.actions.search' | translate"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <zt-data-table
        [columns]="columns"
        [data]="paginatedData()"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalItems]="totalItems()"
        [loading]="false"
        [actionLabel]="'shared.table.view'"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (rowAction)="onViewRow($event)"
        (search)="onSearch($event)"
        (columnFilter)="onColumnFilter($event)"
      />
    </div>
  </div>
</div>
