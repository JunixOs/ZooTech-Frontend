<div class="space-y-6 w-full px-12 lg:px-28">
  <!-- Header de la Página -->
  <div
    class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 mb-2 border-b border-slate-200"
  >
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center w-10 h-10 rounded-lg bg-rose-900/10">
        <i class="fa-solid fa-venus text-rose-800 text-lg"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-slate-800 uppercase tracking-wide leading-tight">
          {{ 'sidebar.celo' | translate }}
        </h2>
        <nav class="flex items-center gap-1.5 text-xs font-medium text-slate-400 mt-0.5">
          <span class="hover:text-rose-800 transition-colors cursor-pointer">{{
            'sidebar.reproduccion' | translate
          }}</span>
          <i class="fa-solid fa-chevron-right text-[8px] text-slate-300"></i>
          <span class="text-slate-600 font-semibold">{{ 'sidebar.celo' | translate }}</span>
        </nav>
      </div>
    </div>
  </div>

  <!-- Contenedor Principal (Card) -->
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <!-- Filtros Superiores -->
    <div
      class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 p-5 bg-gradient-to-r from-slate-50 to-slate-50/50 border-b border-slate-200"
    >
      <div class="flex flex-wrap items-end gap-4">
        <zt-date-range-filter
          [label]="'shared.filters.dateRange' | translate"
          (rangeChange)="onDateRangeChange($event)"
        />
        <button
          type="button"
          (click)="onApplyFilters()"
          class="w-[38px] h-[38px] flex items-center justify-center bg-rose-800 text-white rounded-lg transition-all duration-200 hover:bg-rose-900 hover:shadow-md active:scale-[0.97] shadow-sm border-0 cursor-pointer shrink-0"
          [title]="'shared.actions.search' | translate"
        >
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="p-5">
      <zt-data-table
        [columns]="columns"
        [data]="paginatedData()"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalItems]="totalItems()"
        [loading]="false"
        [actionLabel]="'shared.table.view'"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (rowAction)="onViewRow($event)"
        (search)="onSearch($event)"
        (columnFilter)="onColumnFilter($event)"
      />
    </div>
  </div>
</div>
