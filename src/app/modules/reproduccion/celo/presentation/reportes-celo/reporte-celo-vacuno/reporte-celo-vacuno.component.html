<zt-page-header title="reproduccion.celo.reportes.byCattle.title"
                breadcrumbParent="sidebar.reproduccion"
                breadcrumbParentRoute="/reproduccion/celo"
                breadcrumbMiddle="sidebar.reportes"
                breadcrumbMiddleRoute="/reproduccion/celo/reportes"
                breadcrumbCurrent="reproduccion.celo.reportes.byCattle.title" />

<section class="content-card">
  <div class="filter-bar">
    <div class="filter-inputs">
      <zt-date-range-filter [label]="'shared.filters.dateRange' | translate"
                            (rangeChange)="onDateRangeChange($event)" />

      <button type="button"
              class="filter-submit-btn"
              (click)="onApplyFilters()"
              [title]="'shared.actions.search' | translate">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <button type="button" class="primary-action-btn">
      <i class="fa-solid fa-download"></i>
      <span>{{ 'shared.actions.download' | translate }}</span>
    </button>
  </div>

  <div class="table-container">
    <zt-data-table [columns]="columns"
                   [data]="paginatedData()"
                   [currentPage]="currentPage()"
                   [pageSize]="pageSize()"
                   [totalItems]="totalItems()"
                   [loading]="isLoading()"
                   [actionLabel]="'shared.table.view'"
                   [actionIcon]="'fa-solid fa-magnifying-glass-plus'"
                   (rowAction)="verDetalle($event)"
                   (pageChange)="onPageChange($event)"
                   (pageSizeChange)="onPageSizeChange($event)"
                   (search)="onSearch($event)"
                   (columnFilter)="onColumnFilter($event)" />
  </div>

  <div class="footer-actions">
    <a routerLink="/reproduccion/celo/reportes" class="ghost-action-btn">
      <i class="fa-solid fa-arrow-left"></i>
      {{ 'shared.actions.back' | translate }}
    </a>
  </div>
</section>
