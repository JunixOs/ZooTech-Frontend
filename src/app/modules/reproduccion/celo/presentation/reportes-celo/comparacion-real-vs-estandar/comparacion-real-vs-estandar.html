<zt-page-header title="reproduccion.celo.reportes.realVsStandard.title"
                breadcrumbParent="sidebar.reproduccion"
                breadcrumbParentRoute="/reproduccion/celo"
                breadcrumbMiddle="sidebar.reportes"
                breadcrumbMiddleRoute="/reproduccion/celo/reportes"
                breadcrumbCurrent="reproduccion.celo.reportes.realVsStandard.title" />

<section class="content-card">

  <div class="filter-bar">

    <div class="filter-inputs">

      <zt-date-range-filter [label]="'shared.filters.dateRange' | translate"
                            (rangeChange)="onDateRangeChange($event)">
      </zt-date-range-filter>

      <zt-icon-button
        icon="fa-solid fa-magnifying-glass"
        titleKey="shared.actions.search"
        (clicked)="onApplyFilters()"
      />

    </div>

    <zt-download-button (clicked)="descargarGrafico()" />

  </div>

  @if (cargando()) {

  <div class="loading-container">
    <p>{{ 'reproduccion.celo.reportes.realVsStandard.loading' | translate }}</p>
  </div>

  } @else {

  <div class="chart-container">

    <canvas baseChart
            [data]="lineChartData()"
            [options]="lineChartOptions()"
            [type]="'line'">
    </canvas>

  </div>

  }

  <div class="footer-actions">

    <zt-back-link route="/reproduccion/celo/reportes" />

  </div>

</section>
