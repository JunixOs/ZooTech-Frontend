<div class="reportes-container">
  <zt-page-header
    title="reproduccion.celo.reportes.title"
    breadcrumbParent="sidebar.reproduccion"
    breadcrumbMiddle="sidebar.celo"
    breadcrumbCurrent="sidebar.reportes"
  />

  <!-- Layout de Reportes: filtros + grilla de tarjetas -->
  <zt-report-layout
    [reports]="filteredReports()"
    (search)="onSearch($event)"
    (rangeChange)="onRangeChange($event)"
  />
</div>
