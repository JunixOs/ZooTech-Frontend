<div class="login-container">
  <div class="glass-decoration decoration-1"></div>
  <div class="glass-decoration decoration-2"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">{{ 'common.brandShort' | translate }}</div>
      <h1>{{ 'landing.logo' | translate }}</h1>
      <p>{{ 'login.welcome' | translate }}</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">{{ 'login.email' | translate }}</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="loginData.email"
          required
          email
          [placeholder]="'login.emailPlaceholder' | translate"
        />
      </div>

      @if (isAdminContext) {
        <div class="form-group">
          <label for="password">{{ 'login.password' | translate }}</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="loginData.password"
            required
            [placeholder]="'login.passwordPlaceholder' | translate"
          />
        </div>
      }

      <button type="submit" [disabled]="!loginForm.form.valid" class="btn-submit">
        {{ 'login.submit' | translate }}
      </button>
    </form>

    <div class="login-footer">
      <p>
        {{ 'login.troubleAccessing' | translate }}
        <a href="#">{{ 'login.contactSupport' | translate }}</a>
      </p>
    </div>
  </div>
</div>
