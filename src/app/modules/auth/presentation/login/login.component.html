<div class="login-container">
  <div class="glass-decoration decoration-1"></div>
  <div class="glass-decoration decoration-2"></div>
  
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">ZT</div>
      <h1>Zootech</h1>
      <p>{{ 'login.welcome' | translate }}</p>
    </div>

    @if (errorMessage()) {
      <div class="error-message">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">{{ 'login.email' | translate }}</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="loginData.username"
          required
          placeholder="admin@zootech.com"
        >
      </div>

      <div class="form-group">
        <label for="password">{{ 'login.password' | translate }}</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="loginData.password"
          required
          placeholder="••••••••"
        >
      </div>

      <button type="submit" [disabled]="!loginForm.form.valid || loading()" class="btn-submit">
        {{ loading() ? 'Ingresando...' : ('login.submit' | translate) }}
      </button>
    </form>

    <div class="login-footer">
      <p>{{ 'login.troubleAccessing' | translate }} <a href="#">{{ 'login.contactSupport' | translate }}</a></p>
    </div>
  </div>
</div>
