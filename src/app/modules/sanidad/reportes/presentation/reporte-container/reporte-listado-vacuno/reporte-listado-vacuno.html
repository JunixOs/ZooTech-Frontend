<div class="reporte-listado-container">
  <div class="header">
    <div class="title">LISTADO DE TRIAJES</div>
    <div class="breadcrumb">Sanidad/Reportes/Ver Triajes</div>
  </div>
  
  <div class="content">
    <zt-triaje-list 
      mode="chart" 
      [fixedDateRange]="fixedDateRange()"
      (viewChart)="onViewChart($event)">
    </zt-triaje-list>
  </div>

  <div class="footer">
    <button class="btn-atras" (click)="onBack()">
      <i class="fa-solid fa-reply"></i> Atrás
    </button>
  </div>
</div>
