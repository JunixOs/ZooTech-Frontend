<zt-page-header title="sanidad.reportes.title" breadcrumb="sanidad.reportes.breadcrumb" />
<div class="filters">
  <div class="date-filter-group">
    <zt-date-range-filter
      label="shared.dateFilter.label"
      (rangeChange)="onRangeChange($event)"
    />
    <button type="button" class="filter-submit-btn">
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>
  </div>
    <zt-search-input
    placeholder="Buscar..."
    (search)="onSearch($event)"
  />
</div>



<div class="card">
@if (!selectedReport()) {
  <zt-report-grid [reports]="reports()" [loading]="loading()" />
} @else {
  @if (selectedReport() === 'listado-triajes') {
    <zt-reporte-list />
  }
}
