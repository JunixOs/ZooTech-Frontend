<zt-page-header title="sanidad.reportes.title" breadcrumb="sanidad.reportes.breadcrumb" [message]="successMessage()" />
<div class="filters">
  <div class="date-filter-group">
    <zt-date-range-filter
      label="shared.dateFilter.label"
      [initialStart]="defaultStartStr"
      [initialEnd]="defaultEndStr"
      (rangeChange)="onDateRangeChange($event)"
    />
    <button type="button" class="filter-submit-btn search-btn" (click)="applyFilter()">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Buscar</span>
    </button>
  </div>
    <zt-search-input
    placeholder="Buscar..."
    (search)="onSearch($event)"
  />
</div>



<div class="card">
@if (!selectedReport()) {
  <zt-report-grid [reports]="reports()" [loading]="loading()" />
} @else {
  @if (selectedReport() === 'listado-triajes') {
    <zt-reporte-list />
  }
}
@if (selectedReport() === 'grafico-triaje-vacuno') {
}
@if (selectedReport() === 'listado-triaje-vacuno') {
}
@if (selectedReport() === 'grafico-triaje-general') {
  <zt-reporte-chart-general [dateRange]="appliedDateRange()" (volver)="volver()" (downloadComplete)="onDownloadComplete()" />
}
</div>
