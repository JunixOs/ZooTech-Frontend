<section class="triaje-form">
  <div class="form-column">
    <header class="panel-header">
      <h2>{{ title() }}</h2>
    </header>

    <form class="form-grid" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="fecha">Fecha</label>
        <input id="fecha" type="datetime-local" formControlName="fecha_hora" />
      </div>
      <div class="form-field">
        <label for="vacuno">Vacuno</label>
        <select id="vacuno" formControlName="vacunoId">
          <option value="" disabled>Codigo</option>
          @for (vacuno of vacunos(); track vacuno.id) {
            <option [value]="vacuno.id">
              {{ vacuno.codigo }}
            </option>
          }
        </select>
      </div>

      <div class="form-field">
        <label for="pesoKg">Peso (Kg)</label>
        <input id="pesoKg" type="number" min="0" step="0.01" placeholder="Nueva cantidad" formControlName="pesoKg" />
      </div>

      <div class="form-field">
        <label for="tipoPeso">Tipo de peso</label>
        <select id="tipoPeso" formControlName="tipoPesoCode">
          <option value="" disabled>Seleccione</option>
          @for (tipo of tiposPeso(); track tipo.code) {
            <option [value]="tipo.code">{{ tipo.nombre }}</option>
          }
        </select>
      </div>

      <div class="form-field full-width">
        <textarea rows="4" placeholder="Observaciones..." formControlName="observaciones"></textarea>
      </div>

      <div class="form-actions full-width">
  <button type="button" class="btn btn-cancel" (click)="onCancel()">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    Cancelar
  </button>

  @if (isViewMode()) {
    <button type="button" class="btn btn-edit" (click)="onEdit()">
      <i class="fa-solid fa-pencil" aria-hidden="true"></i>
      Editar
    </button>
    <button type="button" class="btn btn-delete" (click)="onDelete()">
      <i class="fa-solid fa-trash" aria-hidden="true"></i>
      Eliminar
    </button>
  } @else {
    <button type="submit" class="btn btn-save">
      <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
      Guardar
    </button>
  }
</div>
    </form>
  </div>

  <aside class="history-column">
    <header class="panel-header history-header">
      <h2>HISTORIAL</h2>
    </header>

  <div class="history-content">
  <table class="history-table">
    <thead>
      <tr>
        <th>Fecha y Hora</th>
        <th>Tipo de Peso</th>
        <th>Peso (Kg)</th>
      </tr>
    </thead>
    <tbody>
      @if (historial().length === 0) {
        <tr>
          <td colspan="3" class="history-empty">Identificar<br />Vacuno</td>
        </tr>
      } @else {
        @for (item of historial(); track item.id) {
          <tr>
            <td>{{ item.fechaHora | date:'dd/MM/yyyy HH:mm' }}</td>
            <td>{{ item.tipoPesoCode }}</td>
            <td>{{ item.pesoKg }}</td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
  </aside>
</section>
