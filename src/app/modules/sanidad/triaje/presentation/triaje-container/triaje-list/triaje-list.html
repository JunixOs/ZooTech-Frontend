<div class="triaje-list-container">
  <div class="filters">
    <div class="date-filter-group">
      <zt-date-range-filter
        label="shared.dateFilter.label"
        (rangeChange)="dateRangeChange.emit($event)"
      />
      <zt-button variant="primary">
        <i class="fa-solid fa-magnifying-glass"></i>
      </zt-button>
    </div>

    <zt-button variant="primary" (click)="openNewTriage()">
      <i class="fa-solid fa-plus"></i> {{ 'sanidad.triaje.form.actions.nuevo' | translate }}
    </zt-button>
  </div>

  <zt-data-table
    [columns]="columns"
    [data]="tableData()"
    [loading]="loading()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalItems]="totalItems()"
    actionLabel="shared.table.view"
    (rowAction)="onVerTriaje($event)"
    (pageChange)="pageChange.emit($event)"
    (pageSizeChange)="pageSizeChange.emit($event)"
    (search)="search.emit($event)"
    (columnFilter)="columnFilter.emit($event)"
  />
</div>
