<div class="triaje-header">
  <h2 class="triaje-title">LISTADO DE TRIAJES</h2>
  <span class="triaje-breadcrumb">Sanidad / Ver Triajes</span>
</div>
<zt-triaje-list (nuevoTriaje)="openNewTriage()" />

<zt-modal
  [open]="showNewTriage()"
  size="lg"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeNewTriage()"
>
  <zt-triaje-form (cancelled)="closeNewTriage()" (saved)="closeNewTriage()" />
</zt-modal>
