<zt-page-header title="sanidad.triaje.list.title" breadcrumb="sanidad.triaje.breadcrumb" />
<zt-triaje-list (nuevoTriaje)="openNewTriage()" />

<zt-modal
  [open]="showNewTriage()"
  size="lg"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeNewTriage()"
>
  <zt-triaje-form (cancelled)="closeNewTriage()" (saved)="closeNewTriage()" />
</zt-modal>
