<zt-page-header title="sanidad.triaje.list.title" breadcrumb="sanidad.triaje.breadcrumb" />

<zt-triaje-list
  [recargar]="recargarLista()"
  (nuevoTriaje)="openNewTriage()"
  (verTriaje)="openViewTriage($event)"
/>

<!-- Modal: Nuevo triaje -->
<zt-modal
  [open]="showNewTriage()"
  size="xl"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeNewTriage()"
>
  <zt-triaje-form
    mode="new"
    [tiposPeso]="tiposPeso()"
    [vacunos]="vacunos()"
    [historial]="historial()"
    (vacunoSelected)="onVacunoSelected($event)"
    (cancelled)="closeNewTriage()"
    (saved)="onTriajeSaved($event)"
  />
</zt-modal>

<!-- Modal: Ver triaje -->
<zt-modal
  [open]="showViewTriage()"
  size="xl"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeViewTriage()"
>
  @if (selectedTriaje()) {
    <zt-triaje-form
      mode="view"
      [tiposPeso]="tiposPeso()"
      [vacunos]="vacunos()"
      [triajeData]="selectedTriaje()"
      [historial]="historial()"
      (cancelled)="closeViewTriage()"
      (edited)="onTriajeEdited($event)"
      (deleted)="onTriajeDeleted($event)"
    />
  }
</zt-modal>
