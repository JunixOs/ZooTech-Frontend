<zt-page-header title="sanidad.triaje.list.title" breadcrumb="sanidad.triaje.breadcrumb" />

<zt-triaje-list
  [recargar]="recargarLista()"
  (nuevoTriaje)="openNewTriage()"
  (verTriaje)="openViewTriage($event)"
/>

<!-- Modal: Nuevo triaje -->
<zt-modal
  [open]="showNewTriage()"
  size="xl"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeNewTriage()"
>
  <zt-triaje-form
    mode="new"
    [tiposPeso]="tiposPeso()"
    [vacunos]="vacunos()"
    [historial]="historial()"
    (vacunoSelected)="onVacunoSelected($event)"
    (cancelled)="closeNewTriage()"
    (saved)="onTriajeSaved($event)"
  />
</zt-modal>

<!-- Modal: Ver triaje -->
<zt-modal
  [open]="showViewTriage()"
  size="xl"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeViewTriage()"
>
  @if (selectedTriaje()) {
    <zt-triaje-form
      mode="view"
      [tiposPeso]="tiposPeso()"
      [vacunos]="vacunos()"
      [triajeData]="selectedTriaje()"
      [historial]="historial()"
      (cancelled)="closeViewTriage()"
      (edited)="onTriajeEdited($event)"
      (deleted)="onTriajeDeleted($event)"
    />
  }
</zt-modal>

<!-- Modal: Confirmación de eliminación -->
<zt-modal
  [open]="showDeleteConfirm()"
  size="sm"
  [showHeader]="false"
  [bodyPadding]="false"
  [closeOnBackdrop]="false"
  (closed)="closeDeleteConfirm()"
>
  <div class="delete-confirm">
    <div class="delete-confirm-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h3 class="delete-confirm-title">{{ 'sanidad.triaje.mensajes.confirmarEliminarTitulo' | translate }}</h3>
    <p class="delete-confirm-message">{{ 'sanidad.triaje.mensajes.confirmarEliminar' | translate }}</p>
    <div class="delete-confirm-actions">
      <button type="button" class="btn-confirm-cancel" (click)="closeDeleteConfirm()">
        <i class="fa-solid fa-xmark"></i>
        {{ 'shared.actions.cancel' | translate }}
      </button>
      <button type="button" class="btn-confirm-delete" (click)="confirmDelete()">
        <i class="fa-solid fa-trash"></i>
        {{ 'shared.actions.delete' | translate }}
      </button>
    </div>
  </div>
</zt-modal>
