<zt-page-header
  title="sanidad.reportes.charts.listadoGeneral"
  breadcrumbParent="sanidad.reportes.breadcrumbParent"
  breadcrumbParentRoute="/sanidad/reportes"
  breadcrumbCurrent="sanidad.reportes.charts.route"
/>
<zt-fixed-date-range
  [startDateValue]="filtroService.fechaDesde()"
  [endDateValue]="filtroService.fechaHasta()"
  (rangeChange)="onDateRangeChange($event)"
/>

<zt-data-table
  [columns]="columns"
  [data]="tableData()"
  [loading]="loading()"
  [currentPage]="paginaActual()"
  [pageSize]="tamano()"
  [totalItems]="totalRegistros()"
  [showGlobalSearch]="false"
  (pageChange)="cambiarPagina($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (columnFilter)="onColumnFilter($event)"
>
  <zt-download-button tableActions [disabled]="downloading()" (download)="onDownloadFormat($event)" />
</zt-data-table>

<div class="back-button-wrapper">
  <zt-back-button />
</div>
