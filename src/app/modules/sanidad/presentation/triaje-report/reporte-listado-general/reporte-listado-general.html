<zt-page-header
  title="sanidad.reportes.charts.listadoGeneral"
  breadcrumbParent="sanidad.reportes.breadcrumbParent"
  breadcrumbParentRoute="/sanidad/reportes"
  breadcrumbCurrent="sanidad.reportes.charts.route"
/>
<zt-data-table
  [columns]="columns"
  [data]="tableData()"
  [loading]="loading()"
  [currentPage]="paginaActual()"
  [pageSize]="tamano()"
  [totalItems]="totalRegistros()"
  actionLabel="shared.table.view"
  (rowAction)="onVerTriaje($event)"
  (pageChange)="cambiarPagina($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (search)="onSearch($event)"
  (columnFilter)="onColumnFilter($event)"
/>
