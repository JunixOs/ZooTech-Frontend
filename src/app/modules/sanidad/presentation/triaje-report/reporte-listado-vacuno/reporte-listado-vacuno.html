<zt-page-header
  title="sanidad.reportes.charts.listadoVacuno"
  breadcrumbParent="sanidad.reportes.breadcrumbParent"
  breadcrumbParentRoute="/sanidad/reportes"
  breadcrumbCurrent="sanidad.reportes.charts.route"
/>
<div class="report-actions">
  <div class="btn-group">
    <button class="btn-descargar main-btn" (click)="onDownloadFormat('excel')" [disabled]="downloading()">
      <i class="fa-solid fa-download"></i> {{ 'shared.actions.download' | translate }}
    </button>
    <button class="btn-descargar dropdown-toggle" (click)="toggleDownloadMenu()" [disabled]="downloading()">
      <i class="fa-solid fa-caret-down"></i>
    </button>
  </div>
  @if (showDownloadMenu()) {
    <div class="dropdown-menu">
      <button class="dropdown-item" (click)="onDownloadFormat('excel')">
        Excel (.xlsx)
      </button>
      <button class="dropdown-item" (click)="onDownloadFormat('pdf')">
        Pdf (.pdf)
      </button>
    </div>
  }
</div>
<zt-data-table
    [columns]="columns"
    [data]="tableData()"
    [loading]="facade.loading()"
    [currentPage]="facade.paginaActual()"
    [pageSize]="facade.limitePorPagina()"
    [totalItems]="facade.totalItems()"
    actionLabel="shared.table.view"
    (rowAction)="onVerTriaje($event)"
    (pageChange)="cambiarPagina($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (search)="onSearch($event)"
    (columnFilter)="onColumnFilter($event)"
  />
