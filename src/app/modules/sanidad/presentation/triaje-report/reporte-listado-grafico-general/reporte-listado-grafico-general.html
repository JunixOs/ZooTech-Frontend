<zt-page-header
  title="sanidad.reportes.charts.graficoGeneral"
  breadcrumbParent="sanidad.reportes.breadcrumbParent"
  breadcrumbParentRoute="/sanidad/reportes"
  breadcrumbCurrent="sanidad.reportes.charts.route"
/>
<div class="page-container">
  <div class="chart-box">
    <div class="chart-box-header">
      <zt-fixed-date-range
        [startDateValue]="filtroService.fechaDesde()"
        [endDateValue]="filtroService.fechaHasta()"
        (rangeChange)="onDateRangeChange($event)"
      /><zt-download-button [disabled]="loading()" (download)="onDownloadFormat($event)" />
    </div>

    <div class="chart-content">
      @if (loading()) {
        <div class="loading-state">{{ 'sanidad.reportes.charts.loading' | translate }}</div>
      } @else if (historial().length === 0) {
        <div class="empty-state">{{ 'sanidad.reportes.charts.empty' | translate }}</div>
      } @else {
        <div class="canvas-wrapper" [style.min-width]="'max(100%, ' + (historial().length * 40) + 'px)'">
          <canvas baseChart
            [data]="chartData()"
            [options]="chartOptions"
            [type]="chartType">
          </canvas>
        </div>
      }
    </div>
  </div>

  <div class="page-footer">
    <div class="leyenda-box">
      <span class="leyenda-title">{{ 'sanidad.reportes.charts.legend' | translate }}</span>
      <div class="leyenda-item">
        <span class="leyenda-text">{{ 'sanidad.reportes.charts.weight' | translate }}</span>
        <div class="leyenda-color"></div>
      </div>
    </div>

    <div class="back-button-wrapper">
      <zt-back-button />
    </div>
  </div>
</div>
