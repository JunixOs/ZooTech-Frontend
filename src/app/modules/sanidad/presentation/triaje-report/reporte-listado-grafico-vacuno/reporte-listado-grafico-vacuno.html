<zt-page-header
  [title]="pageTitle()"
  breadcrumbParent="Reportes/Listado de triajes/Gráfico de triajes por vacuno/..."
  breadcrumbParentRoute="/sanidad/reportes/listadoVacuno"
  breadcrumbCurrent=""
/>

<div class="page-container">

  <div class="chart-box">
    <div class="chart-box-header" style="display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap;">
      <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
        <zt-fixed-date-range
          [startDateValue]="filtroService.fechaDesde()"
          [endDateValue]="filtroService.fechaHasta()"
          (rangeChange)="onDateRangeChange($event)"
        />

        <div class="vacuno-selector-section">
          <span class="date-filter-label" style="font-size: 0.9rem; color: var(--color-text-muted); margin-bottom: 5px; display: block;">Seleccionar Vacuno</span>
          <select [value]="vacunoId()" (change)="onVacunoChange($event)" class="vacuno-select" style="background-color: var(--color-surface); border: 1px solid var(--color-border); padding: 6px 12px; border-radius: var(--radius-md); font-size: 0.9rem; color: var(--color-text-main); outline: none; cursor: pointer; min-width: 200px;">
            @for (vacuno of vacunos(); track vacuno.id) {
              <option [value]="vacuno.id">{{ vacuno.codigo }} - {{ vacuno.nombre }}</option>
            }
          </select>
        </div>
      </div>

      <zt-download-button [disabled]="loading()" (download)="onDownloadFormat($event)" />
    </div>

    <div class="chart-content">
      @if (loading()) {
        <div class="loading-state">Cargando gráfico...</div>
      } @else if (historial().length === 0) {
        <div class="empty-state">No hay registros de triaje en este rango de fechas.</div>
      } @else {
        <div class="canvas-wrapper" [style.min-width]="'max(100%, ' + (historial().length * 40) + 'px)'">
          <canvas baseChart
            [data]="chartData()"
            [options]="chartOptions"
            [type]="chartType">
          </canvas>
        </div>
      }
    </div>
  </div>

  <div class="page-footer">
    <div class="leyenda-box">
      <span class="leyenda-title">Leyenda</span>
      <div class="leyenda-item">
        <span class="leyenda-text">Peso (Kg)</span>
        <div class="leyenda-color"></div>
      </div>
    </div>

    <button class="btn-atras" (click)="onBack()">
      <i class="fa-solid fa-reply"></i> Atrás
    </button>
  </div>
</div>
