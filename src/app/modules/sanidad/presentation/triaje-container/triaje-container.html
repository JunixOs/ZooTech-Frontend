<div class="triaje-header">
  <h2 class="triaje-title">LISTADO DE TRIAJES</h2>
  <span class="triaje-breadcrumb">Sanidad / Ver Triajes</span>
</div>
@if (!selectedTriageId()) {
  <app-triaje-list (nuevoTriaje)="openNewTriage()" (verDetalle)="openDetails($event)" />
} @else {
  <app-triaje-detail [triageId]="selectedTriageId()!" (cancelled)="closeDetails()" (saved)="closeDetails()" />
}

<zt-modal
  [open]="showNewTriage()"
  size="xl"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeNewTriage()"
>
  <app-triaje-form (cancelled)="closeNewTriage()" (saved)="closeNewTriage()" />
</zt-modal>
