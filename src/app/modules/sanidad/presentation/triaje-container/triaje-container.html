<zt-page-header
  title="sanidad.triaje.title"
  breadcrumbParent="sanidad.triaje.breadcrumbParent"
  breadcrumbParentRoute="/sanidad/triaje"
  breadcrumbCurrent="sanidad.triaje.breadcrumbCurrent"
/>

<zt-triaje-list
  [triajes]="facade.triajes()"
  [loading]="facade.loading()"
  [currentPage]="facade.paginaActual()"
  [pageSize]="facade.limitePorPagina()"
  [totalItems]="facade.totalItems()"
  (nuevoTriaje)="openNewTriage()"
  (verTriaje)="openViewTriage($event)"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (search)="onSearch($event)"
  (columnFilter)="onColumnFilter($event)"
  (dateRangeChange)="onDateRangeChange($event)"
/>

<zt-modal
  [open]="showNewTriage()"
  size="xl"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeNewTriage()"
>
  <zt-triaje-form
    mode="new"
    [tiposPeso]="tiposPeso()"
    [vacunos]="vacunos()"
    [historial]="historial()"
    (cancelled)="closeNewTriage()"
    (saved)="onTriajeSaved($event)"
    (vacunoChange)="onVacunoChange($event)"
  />
</zt-modal>

<zt-modal
  [open]="showViewTriage()"
  size="xl"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeViewTriage()"
>
  @if (selectedTriaje()) {
    <zt-triaje-form
      mode="view"
      [tiposPeso]="tiposPeso()"
      [vacunos]="vacunos()"
      [triajeData]="selectedTriaje()"
      [historial]="historial()"
      (cancelled)="closeViewTriage()"
      (edited)="onTriajeEdited($event)"
      (deleted)="onTriajeDeleted($event)"
    />
  }
</zt-modal>

<zt-modal
  [open]="showDeleteModal()"
  size="md"
  [showHeader]="false"
  [bodyPadding]="false"
  (closed)="closeDeleteModal()"
>
  @if (triajeToDelete()) {
    <div class="delete-modal-container">
      <!-- Header -->
      <div class="delete-modal-header">
        <span class="info-icon">ⓘ</span>
        <span class="header-title">ADVERTENCIA</span>
      </div>

      <!-- Body -->
      <div class="delete-modal-body">
        <div class="trash-icon-container">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="trash-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>
        </div>

        <h3 class="delete-title">¿Estas seguro que deseas <span class="highlight-delete">ELIMINAR</span>?</h3>

        <!-- Metadata Table -->
        <table class="delete-metadata-table">
          <thead>
            <tr>
              <th>Fecha y Hora</th>
              <th>C.Triaje</th>
              <th>Vacuno</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>{{ triajeToDelete()?.fechaHora | date: 'dd/MM/yyyy hh:mm a' }}</td>
              <td>{{ triajeToDelete()?.codigo }}</td>
              <td>{{ triajeToDelete()?.codigoVacuno || triajeToDelete()?.vacunoNombre }}</td>
            </tr>
          </tbody>
        </table>

        <!-- Textarea Reason -->
        <div class="delete-reason-container">
          <textarea
            class="delete-reason-textarea"
            placeholder="¿Por qué desea eliminar?"
            [value]="deleteReason()"
            (input)="onDeleteReasonChange($event)"
            rows="3"
          ></textarea>
        </div>

        <!-- Actions -->
        <div class="delete-modal-actions">
          <button class="btn-no" (click)="closeDeleteModal()">
            <span class="btn-icon">✕</span> No
          </button>
          <button class="btn-yes" (click)="confirmDelete()">
            <span class="btn-icon">✓</span> Si
          </button>
        </div>
      </div>
    </div>
  }
</zt-modal>
