<div class="triaje-list-container">
  <div class="filters">
    <div class="filter-field">
      <label>Fecha Inicio</label>
      <input type="date" />
    </div>
    <div class="filter-field">
      <label>Fecha Fin</label>
      <input type="date" />
    </div>
    <button class="btn-buscar">
      <i class="fa-solid fa-table"></i> Buscar
    </button>
<button type="button" class="btn-nuevo-triaje" (click)="openNewTriage()">
    <i class="fa-solid fa-plus"></i> Nuevo Triaje
  </button>
  </div>

  <table class="triaje-table">
    <thead>
      <tr>
        <th>FECHA</th>
        <th>CODIGO</th>
        <th>NOMBRE</th>
        <th>TIPO DE PESO MEDIDO</th>
        <th>PESO (KG)</th>
        <th>OPCIONES</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>12/05/2022</td>
        <td>V125B</td>
        <td>Azucar</td>
        <td>Nacimiento</td>
        <td>6.480</td>
        <td>
          <button class="btn-ver">
            <i class="fa-solid fa-magnifying-glass-plus"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="table-footer">
    <span>Mostrando 10 de 30</span>
    <div class="pagination">
      <button>Anterior</button>
      <button class="active">1</button>
      <button>2</button>
      <button>Siguiente</button>
    </div>
  </div>
</div>
