<div class="leche-report-page">
  <!-- Header de la Página -->
  <div class="reporte-header">
    <h2 class="page-title">
      {{ 'sidebar.milkProduction' | translate }}
    </h2>
    <nav class="breadcrumb">
      <span class="breadcrumb-link">{{ 'sidebar.milkProduction' | translate }}</span>
      <i class="fa-solid fa-chevron-right breadcrumb-separator"></i>
      <span class="breadcrumb-active">{{ 'sidebar.reportes' | translate }}</span>
    </nav>
  </div>

  <zt-report-layout
    [reports]="reports()"
    [loading]="loading()"
    (rangeChange)="onRangeChange($event)"
    (search)="onSearch($event)"
  >
  </zt-report-layout>
  
</div>
