<div class="milk-container">
  <!-- HEADER -->
  <header class="header-section">
    <div class="title-area">
      <h2 class="page-title">{{ 'sidebar.milkProduction' | translate }}</h2>
    </div>

    <button type="button" (click)="openModal()" class="btn-add">
      <i class="fa-solid fa-plus icon-small"></i>
      <span>{{ 'leche.registro.add' | translate }}</span>
    </button>
  </header>

  <!-- CONTENIDO PRINCIPAL (Card) -->
  <main class="main-card">
    <!-- Filtros Superiores -->
    <div class="filters-panel">
      <div class="filters-wrapper">
        <zt-date-range-filter
          [label]="'shared.filters.dateRange' | translate"
          (rangeChange)="onDateRangeChange($event)"
        />
      </div>
    </div>

    <!-- Tabla de Datos -->
    <zt-data-table
      [columns]="columns()"
      [data]="data()"
      [loading]="loading()"
      [actionLabel]="'shared.table.view' | translate"
      (rowAction)="onViewRow($event)"
      [totalItems]="totalItems()"
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      (search)="onSearch($event)"
    />
  </main>
</div>

<!-- MODALES -->
<zt-leche-form
  *ngIf="showFormModal()"
  (close)="closeModal()"
  (save)="onFormSave($event)"
></zt-leche-form>

<zt-leche-detail
  *ngIf="showDetailModal()"
  [registroId]="selectedId()"
  (close)="closeDetail()"
></zt-leche-detail>
