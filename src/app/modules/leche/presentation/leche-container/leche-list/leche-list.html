<div class="space-y-6">
  <!-- HEADER -->
  <div class="flex items-center justify-between border-b border-gray-200 pb-4">
    <div class="flex flex-col gap-1">
      <h2 class="text-xl font-bold text-gray-800 uppercase tracking-wide">
        {{ 'sidebar.milkProduction' | translate }}
      </h2>
      <nav class="flex items-center gap-2 text-xs font-semibold text-gray-500">
        <span class="hover:text-[var(--color-primary)] transition-colors cursor-pointer">
          {{ 'sidebar.milkProduction' | translate }}
        </span>
        <span class="text-gray-300">/</span>
        <span class="text-gray-800">
          {{ 'sidebar.milkProduction' | translate }}
        </span>
      </nav>
    </div>

    <button
      type="button"
      (click)="openModal()"
      class="inline-flex items-center justify-center gap-2 h-10 px-6 rounded-xl bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] text-white text-sm font-semibold tracking-wide shadow-sm hover:shadow-md transition-all duration-200 whitespace-nowrap cursor-pointer"
    >
      <i class="fa-solid fa-plus text-xs"></i>
      <span>{{ 'leche.registro.add' | translate }}</span>
    </button>
  </div>

  <!-- CONTENIDO PRINCIPAL (Card) -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-6">
    <!-- Filtros Superiores (Date Range, la búsqueda se maneja dentro de zt-data-table) -->
    <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 border border-gray-100 p-5 rounded-xl bg-gray-50/50">
      <div class="flex flex-wrap items-end gap-4">
        <zt-date-range-filter
          [label]="'shared.filters.dateRange' | translate"
          (rangeChange)="onDateRangeChange($event)"
        />
      </div>
    </div>

    <!-- Tabla de Datos -->
    <zt-data-table
      [columns]="columns()"
      [data]="paginatedData()"
      [loading]="false"
      [actionLabel]="'shared.table.view' | translate"
      (rowAction)="onViewRow($event)"
      [totalItems]="totalItems()"
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      (search)="onSearch($event)"
    />
  </div>
</div>

<zt-leche-form
  *ngIf="showFormModal()"
  (close)="closeModal()"
  (save)="onFormSave($event)"
></zt-leche-form>
