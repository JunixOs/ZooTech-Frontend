<div class="flex flex-col gap-6 p-6 bg-[var(--primary-light)] min-h-screen">
  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-[var(--text-main)] tracking-tight">
      {{ 'leche.registro.title' | translate }}
    </h2>
    <button
      type="button"
      (click)="openModal()"
      class="flex items-center gap-2 bg-[var(--primary-rose)] hover:bg-[var(--primary-dark)] text-white font-semibold px-5 py-2.5 rounded-lg shadow-md transition-colors duration-150 cursor-pointer"
    >
      <i class="fa-solid fa-bottle-droplet text-sm"></i>
      {{ 'leche.registro.add' | translate }}
    </button>
  </div>

  <!-- CONTENIDO -->
  <div class="flex flex-col gap-5">
    <div
      class="flex flex-wrap items-end gap-6 bg-white rounded-xl shadow-sm border border-gray-200 px-6 py-4"
    >
      <!-- Fecha Inicial y Final -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
          {{ 'shared.filters.fechaInicial' | translate }}
        </label>
        <zt-date-range-filter
          [label]="'shared.filters.dateRange' | translate"
          (rangeChange)="onDateRangeChange($event)"
        />
      </div>

      <div class="flex flex-col gap-1 ml-auto">
        <label class="text-xs font-semibold text-[var(--text-main)] uppercase tracking-wide">
          {{ 'shared.search.global' | translate }}
        </label>
        <zt-search-input
          [placeholder]="'shared.search.default' | translate"
          (search)="onSearch($event)"
        />
      </div>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-xl shadow-sm border border-[var(--primary-rose)] overflow-hidden">
      <div class="p-4">
        <zt-data-table
          [columns]="columns()"
          [data]="data()"
          [loading]="loading()"
          [actionLabel]="'shared.table.view' | translate"
          (rowAction)="onRowAction($event)"
          [totalItems]="totalItems()"
          [currentPage]="currentPage()"
          [pageSize]="pageSize()"
        />
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-between px-5 py-3 border-t border-gray-100 bg-gray-50">
        <p class="text-sm text-gray-500">
          Mostrando del {{ showingFrom() }} al {{ showingTo() }} de {{ totalItems() }} filas
        </p>
        <zt-paginator
          [pageSize]="pageSize()"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)"
          [currentPage]="currentPage()"
          [totalItems]="totalItems()"
        />
      </div>
    </div>
  </div>
</div>

<zt-leche-form
  *ngIf="showFormModal()"
  (close)="closeModal()"
  (save)="onFormSave($event)"
></zt-leche-form>
