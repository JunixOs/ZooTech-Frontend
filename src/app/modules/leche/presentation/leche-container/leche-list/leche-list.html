<div class="flex flex-col gap-6 p-6 border-y-primary-light)] min-h-screen">
  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-[var(--color-text-muted)] tracking-tight">
      {{ 'sidebar.milkProduction' | translate }}
    </h2>
    <button
      type="button"
      (click)="openModal()"
      class="inline-flex items-center justify-center gap-3 h-[30px] px-8 rounded-xl bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] text-white text-[0.9rem] font-semibold tracking-[0.3px] shadow-sm hover:shadow-md transition-all duration-200 whitespace-nowrap cursor-pointer"
    >
      <i class="fa-solid fa-plus text-[0.78rem]"></i>

      <span> {{ 'leche.registro.add' | translate }} </span>
    </button>
  </div>

  <!-- CONTENIDO -->
  <div class="flex flex-col gap-5">
    <!-- Filtros -->
    <div
      class="flex flex-wrap items-end gap-6 bg-white rounded-xl shadow-sm border border-gray-200 px-6 py-4"
    >
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
          {{ 'shared.filters.fechaInicial' | translate }}
        </label>
        <zt-date-range-filter
          [label]="'shared.filters.dateRange' | translate"
          (rangeChange)="onDateRangeChange($event)"
        />
      </div>
      <div class="flex flex-col gap-1 ml-auto">
        <label class="text-xs font-semibold uppercase tracking-wide">
          {{ 'shared.search.global' | translate }}
        </label>
        <zt-search-input
          [placeholder]="'shared.search.default' | translate"
          (search)="onSearch($event)"
        />
      </div>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-xl shadow-sm border border-[var(--color-primary)] overflow-hidden">
      <div class="p-4">
        <zt-data-table
          [columns]="columns()"
          [data]="paginatedData()"
          [loading]="false"
          [actionLabel]="'shared.table.view' | translate"
          (rowAction)="onViewRow($event)"
          [totalItems]="totalItems()"
          [currentPage]="currentPage()"
          [pageSize]="pageSize()"
        />
      </div>
      <!-- Footer -->
      <div class="flex items-center justify-between px-5 py-3 border-t border-gray-100 bg-gray-50">
        <p class="text-sm text-gray-500">
          Mostrando del {{ showingFrom() }} al {{ showingTo() }} de {{ totalItems() }} filas
        </p>
        <zt-paginator
          [pageSize]="pageSize()"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)"
          [currentPage]="currentPage()"
          [totalItems]="totalItems()"
        />
      </div>
    </div>
  </div>
</div>

<zt-leche-form
  *ngIf="showFormModal()"
  (close)="closeModal()"
  (save)="onFormSave($event)"
></zt-leche-form>
