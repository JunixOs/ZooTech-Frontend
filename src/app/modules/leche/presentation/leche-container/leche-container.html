<div class="p-4 md:p-6 space-y-4 max-w-full mx-auto">

  <!-- Header de la Página -->
  <div class="flex items-center justify-between border-b-2 border-slate-200 pb-2 mb-6">
    <h2 class="text-xl font-bold text-slate-800 uppercase tracking-wide">
      {{ 'sidebar.milkProduction' | translate }}
    </h2>

    <nav class="flex items-center gap-2 text-xs font-semibold text-slate-500">
      <span class="hover:text-rose-800 transition-colors cursor-pointer">{{ 'sidebar.milkProduction' | translate }}</span>
      <span class="text-slate-300">/</span>
      <span class="text-slate-800">{{ 'sidebar.milkItem' | translate }}</span>
    </nav>
  </div>

  <!-- Contenedor Principal (Card) -->
  <div class="bg-white rounded-lg border border-slate-300 shadow-sm p-6 space-y-8">
    
    <!-- Filtros Superiores -->
    <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 border border-slate-200 p-6 rounded-lg bg-slate-50/30">
      <div class="flex flex-wrap items-end gap-4">
        <zt-date-range-filter
          [label]="'shared.filters.dateRange' | translate"
          (rangeChange)="onDateRangeChange($event)"
        />
        <button
          type="button"
          (click)="onSearch(searchTerm())"
          class="flex items-center justify-center gap-2 px-6 py-2.5 bg-rose-800 text-white font-bold text-sm rounded transition-all hover:bg-rose-900 shadow-sm border-0 cursor-pointer"
        >
          <i class="fa-solid fa-calendar-days"></i>
          {{ 'shared.actions.search' | translate }}
        </button>
      </div>

      <button
        type="button"
        (click)="openForm()"
        class="flex items-center justify-center gap-2 px-6 py-2.5 bg-rose-800 text-white font-bold text-sm rounded transition-all hover:bg-rose-900 shadow-sm border-0 cursor-pointer"
      >
        <i class="fa-solid fa-plus"></i>
        {{ 'leche.registro.add' | translate }}
      </button>
    </div>

    <!-- Data Table -->
    <zt-data-table
      [columns]="columns"
      [data]="paginatedData()"
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      [totalItems]="totalItems()"
      [loading]="loading()"
      [actionLabel]="'shared.table.view'"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      (rowAction)="onViewRow($event)"
      (search)="onSearch($event)"
    />

  </div>
</div>

<!-- MODALES -->
<zt-leche-form
  *ngIf="showFormModal()"
  (close)="closeForm()"
  (save)="onFormSave($event)"
></zt-leche-form>

<zt-leche-detail
  *ngIf="showDetailModal()"
  [registroId]="selectedId()"
  (close)="closeDetail()"
></zt-leche-detail>
