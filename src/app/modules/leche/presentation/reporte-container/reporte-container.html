<div class="leche-container">
  <zt-page-header
    title="sidebar.reportes"
    breadcrumbParent="sidebar.milkProduction"
    breadcrumbCurrent="sidebar.reportes"
  />

  <!-- Contenedor Principal (Card) -->
  <div class="content-card">
    <!-- Filtros Superiores -->
    <div class="filter-bar">
      <div class="filter-inputs">
        <zt-date-range-filter
          [label]="'shared.filters.dateRange' | translate"
          (rangeChange)="onDateRangeChange($event)"
        />
        <button
          type="button"
          (click)="onSearch(searchTerm())"
          class="filter-submit-btn"
          [title]="'shared.actions.search' | translate"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <zt-data-table
        [columns]="columns"
        [data]="paginatedData()"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalItems]="totalItems()"
        [loading]="loading()"
        [actionLabel]="'shared.table.view'"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (rowAction)="onViewRow($event)"
        (search)="onSearch($event)"
      />
    </div>

  </div>
</div>

<!-- MODALES -->
<zt-leche-detail
  *ngIf="showDetailModal()"
  [registroId]="selectedId()"
  (close)="closeDetail()"
></zt-leche-detail>
