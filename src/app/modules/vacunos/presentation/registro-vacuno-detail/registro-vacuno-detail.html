<section class="detail-page">
  <zt-page-header
    title="vacunos.reportes.detail.title"
    breadcrumbParent="sidebar.vacunos"
    breadcrumbParentRoute="/vacunos/listado"
    breadcrumbMiddle="sidebar.reportes"
    breadcrumbMiddleRoute="/vacunos/reportes"
    breadcrumbCurrent="vacunos.reportes.recordList.breadcrumb"
    breadcrumbCurrentRoute="/vacunos/reportes/registro"
    [breadcrumbDetail]="breadcrumbDetail()"
  />

  @if (loading()) {
    <div class="status-card loading">{{ 'vacunos.reportes.detail.loading' | translate }}</div>
  } @else if (error(); as message) {
    <div class="status-card alert">{{ message }}</div>
  } @else if (registro(); as response) {
    <div class="report-content">
      <div class="download-area">
        <zt-download-button [disabled]="loading()" (download)="descargar($event)" />
      </div>

      <zt-vacuno-detail-section
        class="identification-section"
        titleKey="vacunos.reportes.detail.sections.identification"
      >
        <div class="field-grid four">
          <zt-vacuno-detail-field
            labelKey="vacunos.reportes.detail.fields.codigo"
            [value]="response.vacuno.codigo"
          />
          <zt-vacuno-detail-field
            labelKey="vacunos.reportes.detail.fields.nombre"
            [value]="response.vacuno.nombre"
          />
          <zt-vacuno-detail-field
            labelKey="vacunos.reportes.detail.fields.fechaNacimiento"
            [value]="response.vacuno.fechaNacimiento"
          />
          <zt-vacuno-detail-field
            labelKey="vacunos.reportes.detail.fields.adquisicion"
            [value]="response.vacuno.adquisicionPor"
          />
          <zt-vacuno-detail-field
            labelKey="vacunos.reportes.detail.fields.precioCompra"
            [value]="response.vacuno.precioCompra"
          />
          <zt-vacuno-detail-field
            labelKey="vacunos.reportes.detail.fields.raza"
            [value]="response.vacuno.raza"
          />
          <zt-vacuno-detail-field
            labelKey="vacunos.reportes.detail.fields.color"
            [value]="response.vacuno.color"
          />
          <zt-vacuno-detail-field
            labelKey="vacunos.reportes.detail.fields.sexo"
            [value]="response.vacuno.sexo"
          />
        </div>
      </zt-vacuno-detail-section>

      <div class="detail-grid">
        <zt-vacuno-detail-section
          class="traceability-section"
          titleKey="vacunos.reportes.detail.sections.traceability"
        >
          <div class="traceability-content">
            <div class="photo-block">
              <span class="photo-label">{{
                'vacunos.reportes.detail.fields.foto' | translate
              }}</span>
              <div class="photo-frame">
                @if (response.vacuno.fotoUrl) {
                  <img [src]="response.vacuno.fotoUrl" [alt]="response.vacuno.nombre" />
                } @else {
                  <span class="photo-placeholder" aria-hidden="true"></span>
                }
              </div>
            </div>

            <div class="trace-fields">
              <zt-vacuno-detail-field
                labelKey="vacunos.reportes.detail.fields.padre"
                [value]="response.vacuno.codigoPadre"
              />
              <zt-vacuno-detail-field
                labelKey="vacunos.reportes.detail.fields.madre"
                [value]="response.vacuno.codigoMadre"
              />
              <zt-vacuno-detail-field
                labelKey="vacunos.reportes.detail.fields.abuelo"
                [value]="response.vacuno.codigoAbuelo"
              />
              <zt-vacuno-detail-field
                labelKey="vacunos.reportes.detail.fields.abuela"
                [value]="response.vacuno.codigoAbuela"
              />
              <zt-vacuno-detail-field
                class="provenance-field"
                labelKey="vacunos.reportes.detail.fields.procedencia"
                [value]="procedencia(response.vacuno)"
              />
            </div>
          </div>
        </zt-vacuno-detail-section>

        <zt-vacuno-detail-section
          class="specialization-section"
          titleKey="vacunos.reportes.detail.sections.specialization"
        >
          <div class="field-grid two">
            <zt-vacuno-detail-field
              labelKey="vacunos.reportes.detail.fields.aptoPara"
              [value]="response.vacuno.aptoPara"
            />
            <zt-vacuno-detail-field
              labelKey="vacunos.reportes.detail.fields.fechaRegistro"
              [value]="response.vacuno.fechaRegistro || response.vacuno.fechaEspecificacion"
            />
          </div>
        </zt-vacuno-detail-section>

        <zt-vacuno-detail-section
          class="observations-section"
          titleKey="vacunos.reportes.detail.sections.observations"
        >
          <p>{{ response.vacuno.observaciones }}</p>
        </zt-vacuno-detail-section>
      </div>
    </div>
  }

  <div class="back-button-wrapper">
    <zt-back-button [route]="'/vacunos/reportes/listado'" />
  </div>
</section>
