<zt-page-header
  title="vacunos.listado.title"
  breadcrumbParent="vacunos.listado.home"
  breadcrumbParentRoute="/dashboard"
  breadcrumbCurrent="vacunos.listado.breadcrumb"
/>

@if (error()) {
  <div class="vacunos-error-banner">
    <p>{{ error() | translate }}</p>
  </div>
}

<div class="vacunos-list-card">
  <div class="filter-bar">
    <div class="filter-fields">
      <label class="date-field">
        <span class="date-label">
          {{ 'shared.filters.startDate' | translate }}
        </span>
        <span class="date-input-wrapper">
          <i class="fa-regular fa-calendar date-icon"></i>
          <input
            type="date"
            [ngModel]="fechaDesde()"
            (ngModelChange)="fechaDesdeChange.emit($event)"
            class="date-input"
          />
        </span>
      </label>

      <label class="date-field">
        <span class="date-label">
          {{ 'shared.filters.endDate' | translate }}
        </span>
        <span class="date-input-wrapper">
          <i class="fa-regular fa-calendar date-icon"></i>
          <input
            type="date"
            [ngModel]="fechaHasta()"
            (ngModelChange)="fechaHastaChange.emit($event)"
            class="date-input"
          />
        </span>
      </label>

      @if (fechaDesde() || fechaHasta()) {
        <button
          type="button"
          (click)="filterClear.emit()"
          class="filter-clear-btn"
          [title]="'shared.actions.clear' | translate"
        >
          <i class="fa-solid fa-rotate-right"></i>
          <span class="clear-btn-text">
            {{ 'shared.actions.clear' | translate }}
          </span>
        </button>
      }

      <button type="button" (click)="filterSearch.emit()" class="filter-action">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>{{ 'shared.actions.search' | translate }}</span>
      </button>
    </div>
  </div>

  <!-- Data Table -->
  <zt-data-table
    [columns]="columns"
    [data]="$any(vacunos())"
    [loading]="loading()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalItems]="totalItems()"
    [rowActions]="rowActions"
    (search)="search.emit($event)"
    (columnFilterChange)="filterState.emit($event)"
    (pageChange)="pageChange.emit($event)"
    (pageSizeChange)="pageSizeChange.emit($event)"
    (rowActionSelected)="onRowActionSelected($event)"
  />
</div>
