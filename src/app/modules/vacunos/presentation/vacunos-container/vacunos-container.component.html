@if (deletedCodigo(); as codigo) {
  <div class="vacunos-notif-banner">
    {{ 'vacunos.listado.deleted' | translate: { codigo: codigo } }}
  </div>
}

@if (updatedCodigo(); as codigo) {
  <div class="vacunos-notif-banner">
    {{ 'vacunos.listado.updated' | translate: { codigo: codigo } }}
  </div>
}

<zt-vacunos-list
  [vacunos]="facade.vacunos()"
  [loading]="facade.cargando()"
  [error]="facade.error()"
  [currentPage]="facade.paginaActual()"
  [pageSize]="facade.limitePorPagina()"
  [totalItems]="facade.totalItems()"
  [fechaDesde]="fechaDesde()"
  [fechaHasta]="fechaHasta()"
  (search)="onSearch($event)"
  (filterState)="onFilterState($event)"
  (fechaDesdeChange)="onFechaDesdeChange($event)"
  (fechaHastaChange)="onFechaHastaChange($event)"
  (filterSearch)="buscarPorFechas()"
  (filterClear)="limpiarFechas()"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (editAction)="onEditAction($event)"
/>
