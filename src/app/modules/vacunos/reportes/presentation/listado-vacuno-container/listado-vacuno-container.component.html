<div class="p-3 sm:p-4 lg:p-6 bg-slate-50 min-h-full min-w-0">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4 sm:mb-6">
    <h1 class="text-xl sm:text-2xl font-bold text-slate-800">
      Reporte de registro por vacuno
    </h1>
    <div class="text-xs sm:text-sm text-slate-500">
      <span>Vacunos</span>
      <span class="mx-2">/</span>
      <span>Reportes</span>
      <span class="mx-2">/</span>
      <span class="font-semibold text-slate-700">Registro</span>
    </div>
  </div>

  @if (error(); as message) {
    <div class="bg-rose-100 border-l-4 border-rose-500 text-rose-700 p-4 mb-6 rounded shadow-sm">
      <p class="font-semibold">{{ message }}</p>
    </div>
  }

  <div class="bg-white rounded shadow-sm border border-slate-200 p-3 sm:p-4 lg:p-6 min-w-0">
    <div class="flex flex-col lg:flex-row lg:flex-wrap lg:items-end justify-between gap-4 mb-4 sm:mb-6">
      <div class="flex flex-col sm:flex-row sm:flex-wrap items-stretch sm:items-center gap-4 sm:gap-6">
        <label class="flex flex-col gap-2 w-full sm:w-auto">
          <span class="text-xs font-bold text-slate-700 ml-1">
            {{ 'shared.filters.startDate' | translate }}
          </span>
          <span class="relative group">
            <i class="fa-regular fa-calendar absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-rose-800 transition-colors"></i>
            <input
              type="date"
              [ngModel]="fechaDesde()"
              (ngModelChange)="fechaDesde.set($event)"
              class="w-full sm:min-w-40 pl-10 pr-4 py-2 bg-white border border-slate-300 rounded text-sm font-semibold text-slate-700 focus:outline-none focus:border-rose-800 transition-colors shadow-sm"
            />
          </span>
        </label>

        <label class="flex flex-col gap-2 w-full sm:w-auto">
          <span class="text-xs font-bold text-slate-700 ml-1">
            {{ 'shared.filters.endDate' | translate }}
          </span>
          <span class="relative group">
            <i class="fa-regular fa-calendar absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-rose-800 transition-colors"></i>
            <input
              type="date"
              [ngModel]="fechaHasta()"
              (ngModelChange)="fechaHasta.set($event)"
              class="w-full sm:min-w-40 pl-10 pr-4 py-2 bg-white border border-slate-300 rounded text-sm font-semibold text-slate-700 focus:outline-none focus:border-rose-800 transition-colors shadow-sm"
            />
          </span>
        </label>

        <button
          type="button"
          (click)="buscar(true)"
          class="self-start sm:self-auto sm:mt-6 bg-rose-900 text-white px-4 py-2 rounded border border-rose-900 hover:bg-rose-950 transition-colors cursor-pointer text-sm font-bold flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
          <span>{{ 'shared.actions.search' | translate }}</span>
        </button>
      </div>

      <button
        type="button"
        (click)="volver()"
        class="self-start lg:self-end bg-slate-600 text-white px-4 py-2 rounded border border-slate-600 hover:bg-slate-700 transition-colors cursor-pointer text-sm font-bold flex items-center justify-center gap-2"
      >
        <i class="fa-solid fa-arrow-left"></i>
        <span>{{ 'shared.actions.back' | translate }}</span>
      </button>
    </div>

    <zt-data-table
      [columns]="columns"
      [data]="$any(items())"
      [loading]="loading()"
      [currentPage]="page()"
      [pageSize]="limit()"
      [totalItems]="total()"
      [actionLabel]="'VER'"
      (search)="onSearch($event)"
      (columnFilterChange)="onFilterState($event)"
      (pageChange)="cambiarPagina($event)"
      (pageSizeChange)="cambiarLimite($event)"
      (rowAction)="verDetalle($event)"
    />
  </div>
</div>
