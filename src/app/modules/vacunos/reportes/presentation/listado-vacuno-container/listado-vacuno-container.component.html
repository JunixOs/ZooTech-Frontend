<div class="vacunos-list-wrapper">
  <!-- Top: Title & Breadcrumbs -->
  <div class="vacunos-list-header">
    <h1 class="vacunos-list-title">Reporte de registro por vacuno</h1>
    <div class="vacunos-list-breadcrumb">
      <span>Vacunos</span>
      <span class="breadcrumb-sep">/</span>
      <span>Reportes</span>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-active">Registro</span>
    </div>
  </div>

  @if (error(); as message) {
    <div class="vacunos-error-banner">
      <p>{{ message }}</p>
    </div>
  }

  <div class="vacunos-list-card">
    <div class="flex justify-between items-center mb-4">
      <div class="vacunos-list-filters">
        <zt-date-range-filter
          [label]="'shared.filters.dateRange' | translate"
          (rangeChange)="onDateRangeChange($event)"
        />
      </div>

      <button
        type="button"
        (click)="volver()"
        class="bg-slate-600 text-white px-4 py-2 rounded border border-slate-600 hover:bg-slate-700 transition-colors cursor-pointer text-sm font-bold flex items-center justify-center gap-2 h-fit"
      >
        <i class="fa-solid fa-arrow-left"></i>
        <span>{{ 'shared.actions.back' | translate }}</span>
      </button>
    </div>

    <zt-data-table
      [columns]="columns"
      [data]="$any(items())"
      [loading]="loading()"
      [currentPage]="page()"
      [pageSize]="limit()"
      [totalItems]="total()"
      [actionLabel]="'VER'"
      (search)="onSearch($event)"
      (columnFilterChange)="onFilterState($event)"
      (pageChange)="cambiarPagina($event)"
      (pageSizeChange)="cambiarLimite($event)"
      (rowAction)="verDetalle($event)"
    />
  </div>
</div>
