<div class="listado-vacuno-page">
  <zt-page-header
    title="vacunos.reportes.list.title"
    breadcrumbParent="sidebar.vacunos"
    breadcrumbParentRoute="/vacunos/listado"
    breadcrumbMiddle="sidebar.reportes"
    breadcrumbMiddleRoute="/vacunos/reportes"
    breadcrumbCurrent="vacunos.reportes.list.breadcrumb"
  />

  @if (error(); as message) {
    <div class="error-banner">
      <p>{{ message }}</p>
    </div>
  }

  <div class="content-card">
    <div class="filter-bar">
      <div class="filter-fields">
        <label class="date-field">
          <span class="date-label">
            {{ 'shared.filters.startDate' | translate }}
          </span>
          <span class="date-input-wrapper">
            <i class="fa-regular fa-calendar date-icon"></i>
            <input
              type="date"
              [ngModel]="fechaDesde()"
              (ngModelChange)="fechaDesde.set($event)"
              class="date-input"
            />
          </span>
        </label>

        <label class="date-field">
          <span class="date-label">
            {{ 'shared.filters.endDate' | translate }}
          </span>
          <span class="date-input-wrapper">
            <i class="fa-regular fa-calendar date-icon"></i>
            <input
              type="date"
              [ngModel]="fechaHasta()"
              (ngModelChange)="fechaHasta.set($event)"
              class="date-input"
            />
          </span>
        </label>

        @if (fechaDesde() || fechaHasta()) {
          <button
            type="button"
            (click)="limpiarFechas()"
            class="filter-clear-btn"
            [title]="'shared.actions.clear' | translate"
          >
            <i class="fa-solid fa-rotate-right"></i>
            <span class="clear-btn-text">
              {{ 'shared.actions.clear' | translate }}
            </span>
          </button>
        }

        <button type="button" (click)="buscar(true)" class="filter-action">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>{{ 'shared.actions.search' | translate }}</span>
        </button>
      </div>

      <button type="button" (click)="volver()" class="back-action">
        <i class="fa-solid fa-arrow-left"></i>
        <span>{{ 'shared.actions.back' | translate }}</span>
      </button>
    </div>

    <zt-data-table
      [columns]="columns"
      [data]="$any(items())"
      [loading]="loading()"
      [currentPage]="page()"
      [pageSize]="limit()"
      [totalItems]="total()"
      [actionLabel]="'vacunos.reportes.list.actions.viewDetail'"
      [initialSearch]="q()"
      [initialColumnFilters]="columnFiltersState()"
      (search)="onSearch($event)"
      (columnFilterChange)="onFilterState($event)"
      (pageChange)="cambiarPagina($event)"
      (pageSizeChange)="cambiarLimite($event)"
      (rowAction)="verDetalle($event)"
    />
  </div>
</div>
