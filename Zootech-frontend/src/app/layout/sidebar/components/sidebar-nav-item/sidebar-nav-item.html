@if (section().children && section().children!.length > 0) {
  <div>
    <button
      (click)="toggle()"
      class="flex items-center justify-between w-full px-3 py-2 rounded-lg text-white hover:bg-pink-700 transition-colors">
      <div class="flex items-center gap-3">
        <i [className]="section().icon"></i>
        <span class="text-sm font-semibold tracking-wide">{{ section().label }}</span>
      </div>
      <span class="text-pink-300 text-xs transition-transform duration-200"
        [class.rotate-180]="isOpen()">▼</span>
    </button>

    @if (isOpen()) {
      <div style="margin-left: 1.5rem;  padding-left: 0.5rem; margin-top: 0.25rem; display: flex; flex-direction: column; gap: 0.25rem;">
        @for (child of section().children!; track child.label) {
     <a     
            [routerLink]="child.router"
            routerLinkActive="bg-pink-600"
            class="flex items-center gap-3 px-3 py-2 rounded-lg text-pink-100 hover:bg-pink-700 transition-colors text-sm">
            <i [className]="child.icon"></i>
            <span>{{ child.label }}</span>
          </a>
        }
      </div>
    }
  </div>

} @else {
  <a 
    [routerLink]="section().router"
    routerLinkActive="bg-pink-600"
    class="flex items-center gap-3 px-3 py-2 rounded-lg text-white hover:bg-pink-700 transition-colors">
    <i [className]="section().icon"></i>
    <span class="text-sm font-semibold tracking-wide">{{ section().label }}</span>
  </a>
}
