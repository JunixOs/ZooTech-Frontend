server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------
    # Angular SPA
    # --------------------------------------------------------
    # Si el recurso no existe físicamente, Angular se encarga
    # de resolver la ruta mediante su Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------
    # Archivos estáticos
    # --------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}