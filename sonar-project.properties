# NOTA: En CI/CD el projectKey y projectName se inyectan dinamicamente
# via linea de comando (-Dsonar.projectKey / -Dsonar.projectName).
# Este archivo sirve como fallback para analisis locales.
sonar.projectKey=com.zootech.frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.test.inclusions=**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info