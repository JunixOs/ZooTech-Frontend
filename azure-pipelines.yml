trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

pool:
  name: 'Default'

variables:
  - group: SonarQube

steps:
  - script: |
      npm install -g pnpm@10.23.0
      pnpm install
    displayName: 'Install dependencies'

  - script: |
      npm install -g pnpm@10.23.0
      pnpm run build
    displayName: 'Build Angular'

  - powershell: |
      Write-Host "Sources directory: $(Build.SourcesDirectory)"
      if (Test-Path "$(Build.SourcesDirectory)\dist") {
        Write-Host "dist SI existe. Contenido completo:"
        Get-ChildItem -Path "$(Build.SourcesDirectory)\dist" -Recurse | Select-Object FullName
      } else {
        Write-Host "dist NO existe en absoluto."
      }
      Write-Host "Contenido de la raiz del repo:"
      Get-ChildItem -Path "$(Build.SourcesDirectory)" | Select-Object Name
    displayName: 'Debug: listar dist'

  - script: |
      npm install -g pnpm@10.23.0
      echo "pnpm version:"
      pnpm --version
      echo "node version:"
      node --version
      echo "Running tests..."
      pnpm run test:ci
      echo "Test exit code: %ERRORLEVEL%"
      echo "Checking coverage output:"
      dir coverage\ 2>nul || echo "coverage/ directory not found"
    displayName: 'Run unit tests with coverage'

  - script: |
      D:\sonar-scanner-cli\sonar-scanner-6.2.1.4610-windows-x64\bin\sonar-scanner.bat -Dsonar.projectKey=zootech-frontend -Dsonar.projectName="Zootech Frontend" -Dsonar.sources=src -Dsonar.exclusions=**/node_modules/** -Dsonar.typescript.tsconfigPath=tsconfig.json -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.host.url=$(SONAR_HOST_URL) -Dsonar.token=$(SONAR_TOKEN) -Dsonar.qualitygate.wait=true
    displayName: 'SonarQube Analysis'

  - powershell: |
      $dest = "C:\sites\zootech-web"

      # Buscar la carpeta real del build (donde esta index.html)
      $index = Get-ChildItem -Path "$(Build.SourcesDirectory)\dist" -Recurse -Filter "index.html" -ErrorAction SilentlyContinue | Select-Object -First 1

      if (-not $index) {
        Write-Host "##[error]No se encontro index.html dentro de dist. El build no genero archivos."
        Write-Host "Contenido de dist:"
        Get-ChildItem -Path "$(Build.SourcesDirectory)\dist" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
        exit 1
      }

      $src = $index.DirectoryName
      Write-Host "Desplegando desde: $src"

      Get-ChildItem -Path $dest -Recurse -Force -ErrorAction SilentlyContinue | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
      Copy-Item -Path "$src\*" -Destination $dest -Recurse -Force

      Write-Host "Deploy completado. Archivos en destino:"
      Get-ChildItem -Path $dest | Select-Object Name
    displayName: 'Deploy to IIS'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
