trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

pool:
  name: 'Default'

variables:
  - group: SonarQube

steps:
  - powershell: |
      $pnpm = "C:\tools\pnpm\pnpm.cmd"
      Write-Host "Usando pnpm: $pnpm"
      & $pnpm install
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & $pnpm run build
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & $pnpm run test:ci
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: 'Install, Build & Test'

  - script: |
      D:\sonar-scanner-cli\sonar-scanner-6.2.1.4610-windows-x64\bin\sonar-scanner.bat -Dsonar.projectKey=zootech-frontend -Dsonar.projectName="Zootech Frontend" -Dsonar.sources=src -Dsonar.exclusions=**/node_modules/** -Dsonar.typescript.tsconfigPath=tsconfig.json -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.host.url=$(SONAR_HOST_URL) -Dsonar.token=$(SONAR_TOKEN) -Dsonar.qualitygate.wait=true
    displayName: 'SonarQube Analysis'

  - powershell: |
      $dest = "C:\sites\zootech-web"
      $src = "$(Build.SourcesDirectory)\dist\zootech\browser"

      if (-not (Test-Path "$src\index.html")) {
        Write-Host "##[error]No se encontro index.html en $src"
        exit 1
      }

      Write-Host "Desplegando desde: $src"
      Get-ChildItem -Path $dest -Recurse -Force -ErrorAction SilentlyContinue | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
      Copy-Item -Path "$src\*" -Destination $dest -Recurse -Force

      Write-Host "Deploy completado. Archivos en destino:"
      Get-ChildItem -Path $dest | Select-Object Name
    displayName: 'Deploy to IIS'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
