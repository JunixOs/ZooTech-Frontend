trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

pool:
  name: 'Default'

variables:
  - group: SonarQube

steps:
  - script: |
      npm install -g pnpm@10.23.0
      pnpm install
    displayName: 'Install dependencies'

  - script: |
      npm install -g pnpm@10.23.0
      pnpm run build
    displayName: 'Build Angular'

  - script: |
      D:\sonar-scanner-cli\sonar-scanner-6.2.1.4610-windows-x64\bin\sonar-scanner.bat -Dsonar.projectKey=zootech-frontend -Dsonar.projectName="Zootech Frontend" -Dsonar.sources=src -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts -Dsonar.typescript.tsconfigPath=tsconfig.json -Dsonar.host.url=$(SONAR_HOST_URL) -Dsonar.token=$(SONAR_TOKEN)
    displayName: 'SonarQube Analysis'