trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

pool:
  name: 'Default'

variables:
  - group: SonarQube

steps:
  - script: |
      npm install -g pnpm@10.23.0
      pnpm install
    displayName: 'Install dependencies'

  - script: |
      npm install -g pnpm@10.23.0
      pnpm run build
    displayName: 'Build Angular'

  - script: |
      npm install -g pnpm@10.23.0
      echo "pnpm version:"
      pnpm --version
      echo "node version:"
      node --version
      echo "Running tests..."
      pnpm run test:ci
      echo "Test exit code: %ERRORLEVEL%"
      echo "Checking coverage output:"
      dir coverage\ 2>nul || echo "coverage/ directory not found"
    displayName: 'Run unit tests with coverage'
    continueOnError: true

  - script: |
      D:\sonar-scanner-cli\sonar-scanner-6.2.1.4610-windows-x64\bin\sonar-scanner.bat -Dsonar.projectKey=zootech-frontend -Dsonar.projectName="Zootech Frontend" -Dsonar.sources=src -Dsonar.exclusions=**/node_modules/** -Dsonar.typescript.tsconfigPath=tsconfig.json -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.host.url=$(SONAR_HOST_URL) -Dsonar.token=$(SONAR_TOKEN)
    displayName: 'SonarQube Analysis'